[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate"
version = "0.1.0"
description = "Local AI-call butler: a zero-deploy OpenAI-compatible proxy that meters usage, unifies cost accounting, retries with backover failover, and enforces budgets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TollGate contributors" }]
keywords = [
    "llm",
    "openai-compatible",
    "proxy",
    "metering",
    "cost-tracking",
    "failover",
    "budget",
    "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/liushuangning1023/tollgate"
Issues = "https://github.com/liushuangning1023/tollgate/issues"
Changelog = "https://github.com/liushuangning1023/tollgate/blob/main/CHANGELOG.md"

[project.scripts]
tollgate = "tollgate.cli:main"

[tool.setuptools.packages.find]
include = ["tollgate*"]

[tool.setuptools.package-data]
tollgate = ["pricing.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
